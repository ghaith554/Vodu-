name: Build VODU Cinema TV

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # تُحدَّد من GitHub Secrets (اختيارية). بدونها يُبنى Debug فقط.
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # طريقة الهاتف: إذا رُفع المشروع كملف zip في جذر المستودع، يُفك هنا.
      - name: Unpack project zip (phone upload fallback)
        run: |
          if [ ! -f settings.gradle.kts ] && ls ./*.zip >/dev/null 2>&1; then
            unzip -oq "$(ls ./*.zip | head -n 1)"
          fi
          test -f settings.gradle.kts || { echo "settings.gradle.kts غير موجود: ارفع ملفات المشروع أو ملف zip"; exit 1; }

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform and build-tools
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Prepare Gradle wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Decode signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed Release APK
        if: env.KEYSTORE_BASE64 != ''
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect APK files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/VODU-CINEMA-TV.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/VODU-CINEMA-TV-release.apk
          fi
          ls -l dist

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VODU-CINEMA-TV
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests
            app/build/test-results
          if-no-files-found: ignore

      - name: Build summary
        if: always()
        run: |
          {
            echo "## نتيجة البناء: ${{ job.status }}"
            echo ""
            if ls dist/*.apk >/dev/null 2>&1; then
              echo "| الملف | الحجم |"
              echo "|---|---|"
              for f in dist/*.apk; do echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"; done
            else
              echo "لم يُنتج أي APK. راجع خطوات البناء أعلاه وتقارير الاختبارات (test-reports)."
            fi
            if [ -z "$KEYSTORE_BASE64" ]; then echo ""; echo "ملاحظة: لم تُضبط أسرار التوقيع، لذلك بُنيت نسخة Debug فقط."; fi
          } >> "$GITHUB_STEP_SUMMARY"

      # رابط تنزيل مباشر للـ APK (مفيد للتثبيت على التلفاز بتطبيق Downloader)
      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: VODU Cinema TV (build ${{ github.run_number }})
          files: dist/*.apk
